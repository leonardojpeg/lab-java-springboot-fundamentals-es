spring.application.name=springboot-fundamentals

# This is a local teaching application: it stays on the Spring Boot defaults
# (localhost:8080) and is only meant to be exercised by hand.
server.port=8080

# No static content is served by this lab, so the static resource handlers are
# switched off. Together with the property below it means an unmapped URL
# raises NoHandlerFoundException, which GlobalExceptionHandler turns into a
# clean JSON 404 instead of the default Whitelabel error page.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
